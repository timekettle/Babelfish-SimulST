[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "simulst"
version = "1.0.0"
description = "Streaming simultaneous speech translation (English <-> Chinese): live server, offline replay and evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "numpy", "soundfile>=0.12", "soxr>=0.3",
  "fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9", "websockets>=12", "httpx>=0.27",
]

[project.optional-dependencies]
# vLLM itself is installed separately (pick the build that matches your CUDA driver, see docs/DEPLOYMENT.md)
vllm = ["transformers>=4.57"]
llamacpp = ["transformers>=4.57"]
eval = ["unbabel-comet==2.2.7", "omnisteval==0.1.10", "sacrebleu==2.5.1", "pyyaml"]
test = ["pytest>=8"]

[project.scripts]
simulst-serve = "simulst.server.app:main"
simulst-client = "simulst.client:main"
simulst-stream = "simulst.infer.stream:main"

[project.urls]
Repository = "https://github.com/TimeKettle/Babelfish"

[tool.setuptools.packages.find]
include = ["simulst*"]

[tool.setuptools.package-data]
simulst = ["server/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
